services:

  api:
    build: .
    ports: ["3000:3000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/tasks
    depends_on: 
      db:
        condition: service_healthy
  
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    volumes: 
      - taskdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
 taskdata: